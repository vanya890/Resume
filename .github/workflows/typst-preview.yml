name: Build Typst preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'Resumes/Typst/**'
      - 'data/**'
      - '.github/workflows/typst-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-typst-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Typst
        uses: typst-community/setup-typst@v4
      - name: Compile test resume
        run: |
          mkdir -p dist
          typst compile --root . Resumes/Typst/preview.typ dist/Resume-Typst-preview.pdf
      - name: Upload preview PDF
        uses: actions/upload-artifact@v4
        with:
          name: typst-resume-preview
          path: dist/Resume-Typst-preview.pdf
          if-no-files-found: error
